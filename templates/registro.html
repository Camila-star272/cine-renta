{% extends "base.html" %}
{% block title %}Registro · CineRenta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bg-black border-secondary">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Crear cuenta</h2>
                
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="email" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-cine w-100">Registrarme</button>
                </form>
                
                <p class="text-center mt-3 mb-0">
                    ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" class="text-danger">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
